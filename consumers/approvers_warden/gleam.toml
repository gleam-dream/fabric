# Compiles and tests the warden recipe of `fabric/approvers` verbatim:
# src/approvers_warden.gleam is the block in USAGE.md and of the module
# doc, which scripts/check.py compares. Fabric itself does not depend on
# warden.
name = "approvers_warden"
version = "0.0.0"
target = "erlang"
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
fabric = { path = "../.." }
json_blueprint = { git = "https://github.com/lostbean/json_blueprint.git", ref = "0015fc50ddfd334b9c44253c36dc429d29a5845d" }
warden = { git = "https://github.com/gleam-dream/warden.git", ref = "f28183ebcb8085707054ea7d9b423abd36b649c4" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
