# Unpublished consumer; compiles and tests the saga tool recipe that the
# `fabric/tool` documentation names.
name = "saga_tool_consumer"
version = "0.0.0"
target = "erlang"
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
fabric = { path = "../.." }
saga = { git = "https://github.com/gleam-dream/saga.git", ref = "main" }
gleam_time = ">= 1.11.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
json_blueprint = { git = "https://github.com/lostbean/json_blueprint.git", ref = "main" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "main" }
