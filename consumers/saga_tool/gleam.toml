# Unpublished consumer; compiles the documented saga tool recipe verbatim.
name = "saga_tool_consumer"
version = "0.0.0"
target = "erlang"
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
fabric = { path = "../.." }
saga = { path = "../../../saga" }
gleam_time = ">= 1.11.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
json_blueprint = { path = "../../../json_blueprint" }
sinal = { path = "../../../sinal" }
