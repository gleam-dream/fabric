# A separate consumer of the public graph API; no Saga or Grind dependency.
name = "fabric_graph_demo"
version = "0.0.0"
target = "erlang"
gleam = ">= 1.18.0"

[dependencies]
gleam_time = ">= 1.11.0 and < 2.0.0"
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
fabric = { path = "../.." }
json_blueprint = { git = "https://github.com/lostbean/json_blueprint.git", ref = "8bc8ab4e7d04b23d209680f849e976074bf7c90f" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
