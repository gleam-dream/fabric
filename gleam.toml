name = "fabric"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.18.0"
licenses = ["Apache-2.0"]
description = "A bounded, typed LLM agent runtime for Gleam: typed tools, an explicit policy gate, a pure controller, and a thin OTP runner with cancellation."
repository = { type = "github", user = "gleam-dream", repo = "fabric" }

internal_modules = ["fabric/internal", "fabric/internal/*"]

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_crypto = ">= 1.0.0 and < 2.0.0"
http_gun = { path = "../http_gun" }
json_blueprint = { path = "../json_blueprint" }
llm_wire = { path = "../llm_wire" }
sinal = { path = "../sinal" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
