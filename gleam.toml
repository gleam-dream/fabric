name = "fabric"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.18.0"
licenses = ["Apache-2.0"]
description = "A bounded, typed LLM agent runtime for Gleam: typed tools, an explicit policy gate, a pure controller, and a thin OTP runner with cancellation."
repository = { type = "github", user = "gleam-dream", repo = "fabric" }

internal_modules = ["fabric/internal", "fabric/internal/*"]

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_crypto = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
http_gun = { git = "https://github.com/gleam-dream/http_gun.git", ref = "b2fe1d7cd0ea121e679cdf2c4af5b078330c33e7" }
json_blueprint = { git = "https://github.com/lostbean/json_blueprint.git", ref = "8bc8ab4e7d04b23d209680f849e976074bf7c90f" }
llm_wire = { git = "https://github.com/gleam-dream/llm_wire.git", ref = "2c5eaea0e4af4db68ebc02f0ae10a7f0e6642276" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "95f2dbce4459942e16e819e3527eb00d9c503c9d" }

[dev-dependencies]
gleam_http = ">= 4.0.0 and < 5.0.0"
simplifile = ">= 2.0.0 and < 3.0.0"
gleeunit = ">= 1.0.0 and < 2.0.0"
