name = "fabric_typesafe"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.18.0"
licenses = ["Apache-2.0"]
description = "Typed TypeSafe classifier decisions for Fabric graphs."
internal_modules = ["fabric_typesafe/internal", "fabric_typesafe/internal/*"]

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
fabric = { path = "../.." }
json_blueprint = { path = "../../../json_blueprint" }
gun = ">= 2.6.0 and < 3.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
