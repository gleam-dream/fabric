# Unpublished usage examples: each module is a small program built from
# Fabric's public modules only, and the tests run it.
name = "fabric_usage"
version = "0.0.0"
target = "erlang"
gleam = ">= 1.18.0"

[dependencies]
gleam_time = ">= 1.11.0 and < 2.0.0"
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
fabric = { path = "../.." }
json_blueprint = { git = "https://github.com/gleam-dream/json_blueprint.git", ref = "3adcf515bcc91beb8b40f025c5dc81c4f863b1cf" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "29ea7a90bf820b3c91eb3f76e824abe0d034d78f" }

[dev-dependencies]
simplifile = ">= 2.0.0 and < 3.0.0"
gleeunit = ">= 1.0.0 and < 2.0.0"
